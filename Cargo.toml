[package]
name = "envctl"
version = "0.1.0"
edition = "2021"
description = "Safe, metadata-aware access to dotenv files"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
